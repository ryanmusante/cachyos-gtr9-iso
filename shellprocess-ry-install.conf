---
dontChroot: false
# Timeout budget: staged config install ~5s + fstab rewrite ~1s + pacman -Rns
# ~30s + mkinitcpio -P ~240s + sdboot-manage gen/update ~15s + overhead ~60s
# = ~350s typical. 900s leaves headroom for slow storage and extra kernels.
script:
    - command: "/usr/local/bin/ry-install-post.sh"
      timeout: 900
