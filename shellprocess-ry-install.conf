---
# Runs in the live system with ${ROOT} pointing at the mounted target: the
# airootfs overlay never lands on the target in an online (pacstrap) install,
# so the payload has to be copied across before anything can run inside it.
# Timeout budget: payload copy ~5s + pacman -S of PKGS_ADD ~600s + staged
# config install ~5s + fstab rewrite ~1s + pacman -Rns ~30s + mkinitcpio -P
# ~240s + sdboot-manage gen/update ~15s + overhead ~60s = ~960s typical.
# 1800s leaves headroom for a slow mirror and extra kernels.
dontChroot: true
timeout: 1800
script:
    - command: "/usr/local/share/ry-install/ry-install-stage.sh ${ROOT} ${USER}"
      timeout: 1800
i18n:
    name: "Applying the GTR9 Pro profile..."
